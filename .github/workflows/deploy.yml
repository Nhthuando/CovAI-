name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH vào VPS và kích hoạt deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd /home/dinh/CovAI-
            chmod +x ./deploy.sh
            ./deploy.sh

            # Safe idempotent schema sync for Version Control v2 (never uses prisma migrate deploy)
            if [ -f "server/scripts/applyVersionControlMigration.mjs" ]; then
              if docker ps --format '{{.Names}}' | grep -qx 'covai_server'; then
                docker exec covai_server sh -c 'npx prisma generate && node scripts/applyVersionControlMigration.mjs --apply'
              elif [ -f "server/.env" ] && command -v node >/dev/null 2>&1; then
                (cd server && npx prisma generate && node scripts/applyVersionControlMigration.mjs --apply)
              fi
            fi