name: covai-collaboration-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: covai_test
      POSTGRES_PASSWORD: collaboration-local-only
      POSTGRES_DB: covai_collaboration_test
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covai_test -d covai_collaboration_test"]
      interval: 2s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]
volumes:
  postgres:
