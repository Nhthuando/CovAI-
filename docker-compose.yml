services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: covai_server_prod
    ports:
      - "127.0.0.1:5000:5000"
    mem_limit: 1800m
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://covai_user:CovaiDbPass2026!@postgres:5432/covai_db?schema=public
      - REDIS_URL=redis://redis:6379
      - DISABLE_DOCKER_RUNNER=true
      - GIT_TERMINAL_PROMPT=0
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
      - NODE_OPTIONS=--max-old-space-size=1400 --dns-result-order=ipv4first
    env_file:
      - ./server/.env
    volumes:
      # Persists Git workspaces (.git) and immutable Snapshot CAS blobs (storage/projects/*/vcs/objects/*.gz)
      - server_storage_prod:/app/storage
      - server_uploads_prod:/app/uploads
      - ./shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_GITHUB_CLIENT_ID=Ov23liQ1Hyb1oaqmSTXi
    container_name: covai_client_prod
    ports:
      - "127.0.0.1:5173:80"
      - "127.0.0.1:4173:80"
    mem_limit: 128m
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: covai_postgres_prod
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 768m
    environment:
      - POSTGRES_USER=covai_user
      - POSTGRES_PASSWORD=CovaiDbPass2026!
      - POSTGRES_DB=covai_db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covai_user -d covai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: covai_redis_prod
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 256m
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:
  server_storage_prod:
  server_uploads_prod: