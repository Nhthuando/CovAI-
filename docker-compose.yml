services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: covai_server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - ./shared:/shared
      - /app/node_modules
      - /app/node_modules/.prisma  
    command: sh -c "git config --global --add safe.directory '*' ; npm run dev"
    environment:
      - REDIS_URL=redis://redis:6379
      - DISABLE_DOCKER_RUNNER=true
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: covai_client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - ./shared:/shared
      - /app/node_modules
    command: sh -c "npm run dev -- --host"
    depends_on:
      - server
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: covai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
